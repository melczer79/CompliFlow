<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Kontakt – BuildBaseCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html" class="hero-home-link">
    <header class="hero">
        <div class="container hero-grid">
            <div class="hero-text">
                <h1>Kontakt</h1>
                <p class="subtitle">
                    Haben Sie Fragen zu BuildBaseCore oder möchten Sie ein Angebot anfragen? Schreiben Sie uns eine
                    Nachricht.
                </p>
            </div>
            <div class="hero-visual"></div>
        </div>
    </header>
    </a>

    <section class="section">
        <div class="container">
            <form class="contact-form" action="mailto:info@buildbasecore.at" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Ihr Name" required>

                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" placeholder="ihre@email.at" required>

                <label for="subject">Betreff</label>
                <input type="text" id="subject" name="subject" placeholder="Was möchten Sie uns mitteilen?" required>

                <label for="message">Nachricht</label>
                <textarea id="message" name="message" placeholder="Ihre Nachricht..." required></textarea>

                <button type="submit" class="btn primary">Nachricht senden</button>
            </form>
        </div>
    </section>

    <footer>
    <div class="container">
      <p>© 2026 BuildBaseCore</p>

      <div class="footer-links">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="index.html">Startseite</a>
      </div>
    </div>
  </footer>

</body>

</html>
